# Iosevka build plans inspired by Berkeley Mono (Ultra Compressed) and Paper Mono.
# Build with:  npm run build -- ttf::IosevkaBerk     (narrow)
#              npm run build -- ttf::IosevkaPaper    (normal width)

# ─────────────────────────────────────────────────────────────
# 1. IosevkaBerk — tight, condensed, Berkeley-ish character set
# ─────────────────────────────────────────────────────────────
[buildPlans.IosevkaBerk]
family = "Iosevka Berk"
spacing = "term"              # terminal-friendly; use "normal" if you want wide arrows
serifs = "sans"
noCvSs = true
exportGlyphNames = false      # set true if you use Kitty and want ligatures

[buildPlans.IosevkaBerk.ligations]
inherits = "dlig"             # ligatures off by default (Berkeley/Paper are ligature-free)

[buildPlans.IosevkaBerk.variants.design]
# Digits — plain, sturdy, slashed zero
one          = "base"
two          = "straight-neck-serifless"
three        = "flat-top-serifless"
four         = "closed-serifless"
five         = "upright-flat-serifless"
six          = "closed-contour"
seven        = "straight-serifless"
eight        = "crossing"
nine         = "closed-contour"
zero         = "slashed"

# Capitals — clean, squarish
capital-a    = "straight-serifless"
capital-b    = "standard-serifless"
capital-d    = "standard-serifless"
capital-g    = "toothed-serifless-hookless"
capital-i    = "serifed"
capital-j    = "serifless"
capital-k    = "straight-serifless"
capital-m    = "flat-bottom-serifless"
capital-w    = "straight-flat-top-serifless"

# Lowercase — slabby i/j/l like Berkeley, otherwise sans
a            = "double-storey-serifless"
b            = "toothed-serifless"
d            = "toothed-serifless"
e            = "flat-crossbar"
f            = "flat-hook-serifless"
g            = "single-storey-serifless"
i            = "serifed"
j            = "serifed"
k            = "straight-serifless"
l            = "serifed"
m            = "serifless"
n            = "straight-serifless"
r            = "serifless"
t            = "flat-hook"
u            = "toothed-serifless"
w            = "straight-flat-top-serifless"
y            = "straight-serifless"

# Punctuation & symbols — square dots, compact asterisk
punctuation-dot = "square"
asterisk     = "hex-high"
at           = "fourfold"
dollar       = "through"
percent      = "rings-continuous-slash"
number-sign  = "upright"
ampersand    = "upper-open"
brace        = "curly-flat-boundary"
paren        = "flat-arc"
tilde        = "low"

# Narrow width (Berkeley Ultra Compressed territory). Default Iosevka is 500.
[buildPlans.IosevkaBerk.widths.Normal]
shape = 416
menu  = 5
css   = "normal"

[buildPlans.IosevkaBerk.weights.Light]
shape = 300
menu  = 300
css   = 300

[buildPlans.IosevkaBerk.weights.Regular]
shape = 400
menu  = 400
css   = 400

[buildPlans.IosevkaBerk.weights.Medium]
shape = 500
menu  = 500
css   = 500

[buildPlans.IosevkaBerk.weights.Bold]
shape = 700
menu  = 700
css   = 700

[buildPlans.IosevkaBerk.slopes.Upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.IosevkaBerk.slopes.Italic]
angle = 9.4
shape = "italic"
menu  = "italic"
css   = "italic"

# Taller x-height and a bit more leading, like both fonts
[buildPlans.IosevkaBerk.metricOverride]
xHeight = 540
leading = 1300


# ─────────────────────────────────────────────────────────────
# 2. IosevkaPaper — same glyph choices, roomier Paper/Geist feel
# ─────────────────────────────────────────────────────────────
[buildPlans.IosevkaPaper]
family = "Iosevka Paper"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.IosevkaPaper.ligations]
inherits = "dlig"

[buildPlans.IosevkaPaper.variants]
inherits = "buildPlans.IosevkaBerk"

# Paper Mono is Geist-based: rounder, sans i/l with tails instead of slabs
[buildPlans.IosevkaPaper.variants.design]
i            = "serifed-flat-tailed"
l            = "flat-tailed"
capital-i    = "short-serifed"
punctuation-dot = "round"
zero         = "slashed"

# Wider than default to approach Paper/Geist proportions
[buildPlans.IosevkaPaper.widths.Normal]
shape = 548
menu  = 5
css   = "normal"

[buildPlans.IosevkaPaper.weights.Regular]
shape = 400
menu  = 400
css   = 400

[buildPlans.IosevkaPaper.weights.Medium]
shape = 500
menu  = 500
css   = 500

[buildPlans.IosevkaPaper.weights.Bold]
shape = 700
menu  = 700
css   = 700

[buildPlans.IosevkaPaper.slopes.Upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.IosevkaPaper.slopes.Italic]
angle = 9.4
shape = "italic"
menu  = "italic"
css   = "italic"

[buildPlans.IosevkaPaper.metricOverride]
xHeight = 550
leading = 1350
