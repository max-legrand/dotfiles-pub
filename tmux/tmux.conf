# bind-key T choose-tree -sZ


bind H run-shell "~/.tmux/hide-pane.sh"
bind J run-shell "~/.tmux/show-pane.sh"


# bind-key -r S run-shell "tmux neww ~/tmux-sessionizer"
# bind-key S display-popup -E -w 40% -h 30% \
#   "tmux list-sessions -f '#{?#{==:#{session_name},__HIDDEN__},0,#{?#{==:#{session_name},popup},0,1}}' -F '#{session_name}' \
#     | fzf --layout=default --no-info --no-scrollbar --no-clear \
#     | read s && tmux switch-client -t \"\$s\""

bind-key S run-shell "~/.tmux/session-picker.sh"

# bind-key T choose-tree -sZf '#{?#{==:#{session_name},__HIDDEN__},0,#{?#{==:#{session_name},popup},0,1}}'

# bind-key -r C-q run-shell "~/tmux-sessionizer -s 0"
# bind-key -r C-w run-shell "~/tmux-sessionizer -s 1"
# bind-key -r C-e run-shell "~/tmux-sessionizer -s 2"
# bind-key -r C-r run-shell "~/tmux-sessionizer -s 3"

# bind-key -n C-s send-keys C-l
bind-key -n C-\; send-keys C-l
# bind-key -n C-\; run-shell "echo fired-from-popup >> /tmp/tmux-debug.log"

bind-key t new-window
# Inside a tab popup, prefix + w destroys it for good (next open starts a fresh
# shell); anywhere else it kills the pane as usual. C-w below just detaches,
# leaving the popup's contents intact.
bind-key w if -F '#{m:TABPOPUP_*,#{session_name}}' 'kill-session' 'kill-pane'
bind-key -n C-w if -F '#{m:TABPOPUP_*,#{session_name}}' 'detach-client' 'send-keys C-w'

# Command prompt styling
# set -g message-style "fg=#cdc1ff,bg=default"
# set -g message-command-style "fg=#cdc1ff,bg=default"

# Cursor color
set -g cursor-colour "#cdc1ff"
set -g cursor-style block
set -g prompt-cursor-colour "#cdc1ff"

set -g set-clipboard on
set -ga terminal-features ',*:clipboard'

# Rename via popup instead of inline command-prompt: tmux's command-prompt
# overlay has a redraw bug (status line isn't fully cleared before the new
# text is drawn) on tmux 3.4+ with some terminals (e.g. WezTerm +
# allow-passthrough). A popup pane sidesteps it entirely.
#
# - default-shell is fish, so we use fish's `read -P` (sets the prompt text
#   directly, avoids fish's own default "read>" prompt).
# - No -E here: with -E, Escape/C-c are only caught once the job has exited,
#   so they'd just be forwarded into fish's reader (which doesn't abort on
#   Escape). Without -E, tmux intercepts Escape/C-c itself and closes the
#   popup immediately. We then close it ourselves on normal completion via
#   `display-popup -C`, which closes the popup it's run from.
bind-key r display-popup -w 40 -h 3 -T " rename tab " "read -P ': ' name; [ -n \"\$name\" ] && tmux rename-window \"\$name\"; tmux display-popup -C"
bind-key R display-popup -w 40 -h 3 -T " rename session " "read -P ': ' name; [ -n \"\$name\" ] && tmux rename-session \"\$name\"; tmux display-popup -C"

# Same fix for the default ':' command-prompt, which has the same redraw bug.
bind-key : display-popup -w 60 -h 3 -T " tmux command " "read -P ': ' cmd; [ -n \"\$cmd\" ] && eval tmux \$cmd; tmux display-popup -C"

# Prefix + 3: create 30% / 50% / 20% columns
bind-key 3 split-window -h -p 20 -c "#{pane_current_path}" \; \
    select-pane -L \; \
    split-window -h -p 62 -c "#{pane_current_path}" \; \
    select-pane -L \; \
    resize-pane -x 30% \; \
    select-pane -R \; \
    resize-pane -x 50%

# Prefix + R: reapply ratios to an existing 3-pane layout
bind-key C-r resize-pane -t :.1 -x 30% \; \
  resize-pane -t :.2 -x 50%
