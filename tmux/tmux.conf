# General settings
set -g allow-passthrough on
set-option -g automatic-rename off

# Report a real terminfo entry to programs inside tmux (defaults to "screen"
# otherwise, which drops truecolor/other capabilities). tmux-256color is the
# safe standard here — xterm-ghostty advertises capabilities (kitty keyboard
# protocol, synchronized-output) that don't survive the winghostty -> ConPTY
# -> wsl.exe -> tmux relay intact and caused status-line redraw corruption.
set -g default-terminal 'tmux-256color'
set-option -sa terminal-overrides ",tmux-256color:Tc"

# Pre-warm POPUP session at server start so fish is ready before first open
if-shell "! tmux has-session -t POPUP 2>/dev/null" \
  "new-session -d -s POPUP; set-option -t POPUP status off"

# Keep status bar off in POPUP regardless of theme/TPM overrides
set-hook -g client-session-changed "if-shell '[ \"#{session_name}\" = \"POPUP\" ]' 'set-option -t POPUP status off'"
set-hook -ag client-session-changed "if -F '#{m:TABPOPUP_*,#{session_name}}' 'set-option status off'"
# set -ga update-environment TERM
# set -ga update-environment TERM_PROGRAM

# set-option -g default-shell /run/current-system/sw/bin/fish
# set -g default-shell /run/current-system/sw/bin/fish
# set-option -g default-shell /run/current-system/sw/bin/fish
setw -g xterm-keys on

set-window-option -g mode-keys vi                  # Enable vi mode for copying
set -g status-keys vi                              # Enable vi keys in command prompt

bind-key v copy-mode
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Vi-style copy mode keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection     # Start visual selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.tmux/osc52-copy.sh"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle    # Toggle rectangle selection
bind-key -T copy-mode-vi J send-keys -X halfpage-down \; send-keys -X scroll-middle
bind-key -T copy-mode-vi K send-keys -X halfpage-up \; send-keys -X scroll-middle

# Copy-mode visual selection highlight
set -g mode-style "fg=black,bg=#9f92d8"

# Smoother mouse scrolling (3 lines at a time)
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -X scroll-up'"


unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# winghostty encodes Ctrl+Space as CSI-u codepoint 0 (the legacy NUL byte),
# which tmux's extended-keys parser names "C-@" rather than "C-Space" — so
# the prefix above never matches what actually arrives. Bind C-@ as a second
# prefix to the same key so the physical Ctrl+Space keystroke works either way.
set -g prefix2 C-@
bind C-@ send-prefix


# Remove the confirmation when closing pane
bind x kill-pane

set -sg escape-time 10
set -g history-limit 50000
set -g assume-paste-time 0
set -g mouse on
# setw -g mouse on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-yank'  # disabled: prefers remote xclip over OSC52
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'malaow3/tmux'
# set -g @plugin 'vimlinuz/tmux-floax'
# unbind -n C-p
# set -g @floax-bind '-n C-f'
# set -g @floax-border-color '#cdc1ff'

# Ctrl-f opens the shared, persistent POPUP session.
bind-key -n C-f run-shell '~/.tmux/popuptmux.sh'

# Ctrl-Space, then f toggles a popup scoped to the current window/tab. It is
# backed by a persistent per-window tmux session (TABPOPUP_<window_id>), so its
# contents survive closing and reopening; the first open starts in the active
# pane's directory. Pressing the same key inside the popup detaches it.
bind-key f run-shell "~/.tmux/tab-popup.sh"

# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-sessionist'

# Terminal overrides for true color
# set -ga terminal-overrides ",*256col*:Tc"
# setenv -g COLORTERM truecolor
# set-option -sa terminal-overrides ",xterm*:Tc"
set-option -sa terminal-overrides ",xterm-256color:Tc"

# Base index settings
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Split window bindings
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Dracula theme customizations
set -g @dracula-time-format "%m/%d(%a) %-I:%M%p"
set -g @dracula-show-left-icon "session"
set -g @dracula-plugins "dexcom weather time"
set -g @dracula-weather-colors "light_purple dark_gray"
set -g @dracula-show-powerline "false"
set -g @dracula-show-fahrenheit "true"
set -g @dracula-military-time "false"
set -g @dracula-show-weather "true"
set -g @dracula-fixed-location "Philadelphia PA"
set -g @dracula-show-location "false"
set -g @dracula-add-weather-space "true"
set -g @dracula-color-light_purple $HIGHLIGHT
# set -g @dracula-color-dark_purple $HIGHLIGHT_DARK
# set -g @dracula-color-yellow $ALT_HIGHLIGHT

# Run TPM
run '~/.tmux/plugins/tpm/tpm'

# Ensure status bar is on globally (TPM/theme may leave it off)
set -g status on

# Zoom indicator — appended after TPM so it overrides the theme's status-left
set -ga status-left "#[fg=black,bg=yellow,bold]#{?window_zoomed_flag, Z ,}#[default]"

# Pane navigation with Ctrl + a/s/d/f
# bind-key -n C-a select-pane -L
# bind-key -n C-s select-pane -D
# bind-key -n C-d select-pane -U
# bind-key -n C-f select-pane -R
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# Swap current pane with directional neighbor
bind-key -r h run-shell '~/.tmux/swap-pane.sh L'
bind-key -r j run-shell '~/.tmux/swap-pane.sh D'
bind-key -r k run-shell '~/.tmux/swap-pane.sh U'
bind-key -r l run-shell '~/.tmux/swap-pane.sh R'

unbind -n C-g
# Resize panes with Ctrl + Alt + a/s/d/f
bind-key -n C-S-Left resize-pane -L
bind-key -n C-S-Down resize-pane -D
bind-key -n C-S-Up resize-pane -U
bind-key -n C-S-Right resize-pane -R

# Switch windows with Ctrl + q/e
bind -n C-q previous-window
bind -n C-e next-window

# Switch to session with Ctrl + g
# bind-key -n C-g command-prompt -p "switch to session:" "switch-client -t '%%'"

# Move current window to a specific index (prefix + M, then enter target index)
bind-key M command-prompt -p "move window to index:" "swap-window -t %%"

# Auto-uppercase window and session names
set-hook -g after-rename-window "run-shell 'N=\"#{window_name}\"; U=\$(echo \"\$N\" | tr a-z A-Z); [ \"\$N\" != \"\$U\" ] && tmux rename-window \"\$U\"; true'"
set-hook -g after-rename-session "run-shell 'S=\"#{session_name}\"; U=\$(echo \"\$S\" | tr a-z A-Z); [ \"\$S\" != \"\$U\" ] && tmux rename-session \"\$U\"; true'"
set-hook -g after-new-session 'if -F "#{!=:#{session_name},POPUP}" "set-option status on"'
set-hook -ag after-new-session "run-shell 'S=\"#{session_name}\"; U=\$(echo \"\$S\" | tr a-z A-Z); [ \"\$S\" != \"\$U\" ] && tmux rename-session \"\$U\"; N=\"#{window_name}\"; W=\$(echo \"\$N\" | tr a-z A-Z); [ \"\$N\" != \"\$W\" ] && tmux rename-window \"\$W\"; true'"
set-hook -g after-new-window "run-shell 'N=\"#{window_name}\"; U=\$(echo \"\$N\" | tr a-z A-Z); [ \"\$N\" != \"\$U\" ] && tmux rename-window \"\$U\"; true'"

# Force a full status-line repaint on window/pane switches and resizes.
# tmux's incremental status redraw doesn't fully clear the old line before
# drawing the new one over the winghostty -> ConPTY -> wsl.exe relay (same
# root cause as the command-prompt redraw bug worked around below with
# popups) — this shows up as a doubled/stacked status bar. refresh-client -S
# forces a full non-incremental redraw instead of relying on the diff.
set-hook -g after-select-window 'refresh-client -S'
set-hook -g session-window-changed 'refresh-client -S'
set-hook -g after-resize-window 'refresh-client -S'
set-hook -g client-resized 'refresh-client -S'

# Nudge current window left/right (prefix + < / >)
bind-key -r < swap-window -t -1 \; previous-window
bind-key -r > swap-window -t +1 \; next-window

bind-key -n M-\; set status

# Enable Ctrl+Shift+V for pasting
bind-key -n C-S-V paste-buffer

bind-key x run-shell "tmux capture-pane -S - -E - -p > /tmp/tmux-scrollback.txt" \; new-window "nvim /tmp/tmux-scrollback.txt"


# Get highlight value from env var
set -g popup-border-style "fg=#cdc1ff"
set -g popup-style "bg=default,fg=default"
# set -g popup-style "bg=#101013,fg=$HIGHLIGHT"
# set -g popup-border-style "fg=$HIGHLIGHT"

