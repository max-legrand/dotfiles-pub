bind-key -n M-C-j resize-pane -D 5
bind-key -n M-C-k resize-pane -U 5
bind-key -n M-C-l resize-pane -R 5

# Ctrl+Shift+h/j/k/l to resize panes (WezTerm sends these as CSI u sequences,
# which tmux's extended-keys decodes as C-H/C-J/C-K/C-L).
bind-key -n C-S-h resize-pane -L
bind-key -n C-S-j resize-pane -D
bind-key -n C-S-k resize-pane -U
bind-key -n C-S-l resize-pane -R
