#
# Rex config
#
# A [name] line puts name. in front of every setting after it, so
#
#   [sounds]
#   volume = 0.5
#
# is the same as sounds.volume = 0.5. [] or [*] ends the section.
#
# On/off settings take true, yes, on or 1, and false, no, off or 0.
#



# General

font_size = 15
font_family = PragmataPro VF Liga
font_weight = 350
ui_font_weight = 400
ui_scale_factor = 1
titlebar_mode = compact
# fallback_fonts           = Segoe UI Emoji, Segoe UI Symbol
default_shell = 

# Folders listed by Goto Favorite, e.g. favorites = ["C:\code", "D:\notes"]
# favorites                = []

cursor_blink = false
cursor_style = block
# show_cursor_trail        = true
# cursor_shader            = off     # off | warp | sweep | comet | blaze | blaze_tapered | blaze_no_trail | rainbow | gradient | frozen
smooth_scrolling = true
# copy_on_select           = true
# show_copy_paste_toasts   = true
# copy_animation           = true
# right_click_paste        = true
use_native_context_menus = false
# inactive_pane_dim_amount = 0.35
highlight_active_pane_edges = true
active_pane_highlight_color = accent
# active_pane_highlight_opacity = 1
# animate_active_pane_highlight = fade # fade | move | off
pane_style = comfortable
show_pane_headers = false
# autobalance_splits       = true
# focus_follows_mouse      = false
# disable_animations       = false
# animation_speed_multiplier = 1

developer_mode = false

# tab_placement            = above   # above | left | right | below
default_sidebar_width = 240
# show_tab_close_on_hover  = false
# warn_before_closing_tabs = true



# Theme
#
#   theme = auto | dark | light
#
# Colors: #rgb, #rrggbb, #rrggbbaa, rgb(255, 255, 255), rgba(255, 255, 255, 0.5),
# v4(1, 1, 1, 1), or a name like white, black, transparent.
#
# use_system_accent_color = true uses the Windows accent color for
# accent_color and the terminal selection, over the theme's own colors.

# theme                    = auto    # auto | dark | light
use_system_accent_color  = false

# Accent colors that replace the color palette's own, when
# use_system_accent_color is off. Leave empty to use the palette's.
dark_accent_color        = #74acdf
# light_accent_color       =

# Color palettes set every color in the app and the terminal. default_dark
# and default_light are the defaults, and anything another palette leaves out
# keeps the default's. Name a built-in palette (e.g. merino_dark or Merino Dark)
# or one of your own. Define your own in a [palettes.<id>] section here, or
# in a <id>.ini file (the same keys, without the section) in the palettes
# folder next to this file:
#
#   [palettes.my_theme]
#   name                          = "My Theme"
#   background                    = #0d1117
#   foreground                    = #e6edf3
#   cursor                        = #2f81f7
#   cursor_text                   = #0d1117
#   terminal_selection_background = #264f78
#   terminal_selection_foreground = #e6edf3
#   colors                        = [#484f58, #ff7b72, #3fb950, #d29922]
#   colors[4]                     = #58a6ff
#   colors.5                      = #bc8cff
#   []
#
# colors are the 16 terminal colors (0-7 normal, 8-15 bright). Set them as a
# list, or one at a time with colors[N] or colors.N. Anything left out keeps
# its default.

dark_theme_color_palette = usgc_polyminimal2
# light_theme_color_palette = default_light

[palettes.usgc_polyminimal2]
name                          = "USGC Polyminimal 2"
background                    = #050505
foreground                    = #DDDDDD
cursor                        = #74acdf
cursor_text                   = #191820
terminal_selection_background = #454057
terminal_selection_foreground = #FFFFFF
colors = [#000000, #EC8FB0, #00FFAA, #f6b40e, #74acdf, #CDC1FF, #7E86B4, #DDDDDD, #403833, #E8838F, #00FFAA, #FFD166, #7AA2FF, #AD99FF, #7E86B4, #A8A8A8]
[]

# adaptive_color_palette = true adjusts terminal colors that are hard to read
# on the background, so they reach a minimum contrast.

# adaptive_color_palette    = true

# use_transparent_background = true makes the window background see-through,
# so the desktop shows behind the sidebar, titlebar, tabs and the space around
# panes. When it's off, the window is filled with the theme's background, and
# the palette's background_color is drawn over it, so a translucent
# background_color tints it.
#
# use_transparent_terminal_background = true lets whatever is behind the window
# show through terminals too, instead of filling them with the terminal
# background. Terminal text loses ClearType.
#
# use_backdrop_blur = true blurs what's behind the command palette, for a
# glass effect. false draws it solid.
#
# tint_with_theme = true colors the sidebar, pane headers and the rest of the
# app with the color palette. false uses the built-in default_dark or
# default_light theme for them, and the color palette only applies to terminals.

# use_transparent_background          = true
# use_transparent_terminal_background = false
# use_backdrop_blur                   = true
# tint_with_theme                     = true



# Rex plays a sound when a program in a tab you aren't looking at needs you,
# fails or finishes.
[sounds]
# disable_all              = false
# volume                   = 1
# terminal_bell            = true

# The sound each program status plays: none, attention, warning, error,
# success, ready, loading or tap.
# status_change.working    = loading
# status_change.blocked    = attention
# status_change.error      = error
# status_change.done       = success


# Buttons shown next to the menu in the header.
[shortcuts]
# command_palette          = true
# session_switcher         = true
# activity                 = true
# new_tab                  = true



# Serve Rex over your tailnet as its own Tailscale device. Sign in from
# Settings > Server the first time. Owner only lets in just the Tailscale
# account that signed in; turn it off to let your tailnet's access rules
# decide who can connect.
[server]

tailscale_enabled = true
# tailscale_owner_only     = true
# tailscale_hostname       =

# How this computer appears to Rex servers. The label shows in `rex client ls`
# and is the name `rex -C` accepts; empty uses the computer's name. Remote
# control lets other clients perform actions in this app.
[client]

# label                    =
remote_control = true

# Rex checks for new versions in the background. Updates take effect the
# next time Rex starts.
[updates]
# check_automatically      = true
# install_automatically    = false

[win32]

use_cleartype_in_terminal_text = true
preferred_gpu_driver = auto
vsync = true
# show_tray_icon                 = true
# minimize_to_tray_on_quit       = true


# Developer settings, shown in the command palette when developer_mode is on.

[dev]

update_channel = bleeding_edge
# editor_command           =
# play_typing_sounds       = false
# titlebar_height_override = 0
# scrollbar_gutter_size    = 14
# scrollbar_bar_padding    = 4
# scrollbar_bar_radius     = 2
# cleartype_coverage       = true
# use_tiled_rendering      = true
# show_tiled_redraw_regions = false
# verify_tiled_rendering   = false
# enable_d3d11_debug_layer = false
# show_cursor_shader_bounds = false
# pane_padding             = 6
# pane_radius              = 6

# DANGER: dangerously_allow_anonymous_connections = true also serves Rex on
# port 7297 on every network this computer is on, with no sign-in. Anyone who
# can reach it (for example, others on the same Wi-Fi) can run programs as
# you. Prefer tailscale. Takes effect after restarting the Rex server.

# dangerously_allow_anonymous_connections = false


